<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<title>Mis Finanzas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<meta name="application-name" content="Mis Finanzas">
<meta name="description" content="Tus finanzas personales: cuánto puedes gastar hoy, presupuestos y plan de pagos.">
<meta name="referrer" content="no-referrer">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --text:#14202e; --muted:#6b7785; --line:#e3e8ee;
  --accent:#2463eb; --ing:#12805c; --egr:#c2410c; --int:#6b7785; --chip:#eef2f7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08); --warn:#b45309;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0b1320;--card:#131e2e;--text:#e8edf3;--muted:#8d99a8;--line:#223044;
    --accent:#5b8cff;--ing:#34c38f;--egr:#ff8a5c;--int:#8d99a8;--chip:#1b2839;--shadow:none;--warn:#f5b544}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-feature-settings:'tnum' 1,'cv11' 1;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
@media (max-width:480px){h1{font-size:18px;white-space:nowrap}.mes span{min-width:0;white-space:nowrap;font-size:14px}.mes{gap:4px}.mes button{width:30px;height:30px}}
.mes{display:flex;align-items:center;gap:6px}
.mes button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:34px;height:34px;cursor:pointer}
.mes span{min-width:118px;text-align:center;font-weight:600;text-transform:capitalize}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat.big{grid-column:1/-1}
.stat small{color:var(--muted);font-size:12px;display:block}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat.big b{font-size:28px}
.ing{color:var(--ing)} .egr{color:var(--egr)} .int{color:var(--int)}
h2{font-size:15px;margin:0 0 10px;color:var(--text);font-weight:650;letter-spacing:-.01em}
.bar{margin:9px 0;cursor:pointer}
.bar .t{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.bar .t span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .track{height:8px;background:var(--chip);border-radius:6px;margin-top:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--egr);border-radius:6px}
.trend{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:6px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.trend .pair{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.trend .pair div{width:40%;max-width:18px;border-radius:4px 4px 0 0;min-height:2px}
.trend small{font-size:11px;color:var(--muted);text-transform:capitalize}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:20px;white-space:nowrap;cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.search{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.day{font-size:12px;color:var(--muted);margin:16px 4px 6px;text-transform:capitalize;display:flex;justify-content:space-between;gap:8px}
.day b{font-variant-numeric:tabular-nums;color:var(--egr);font-weight:600}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.item .ico{width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:none;font-size:16px}
.item .mid{flex:1;min-width:0}
.item .d{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;margin-right:5px;font-weight:600;background:var(--chip)}
.badge.cr{background:#fde7dc;color:#9a3412}.badge.de{background:#dbeafe;color:#1e40af}.badge.tr{background:#e5e7eb;color:#374151}.badge.in{background:#d1fae5;color:#065f46}
@media (prefers-color-scheme: dark){.badge.cr{background:#4a2413;color:#ffb38f}.badge.de{background:#16284a;color:#9ec2ff}.badge.tr{background:#2a3444;color:#c3cbd6}.badge.in{background:#10362a;color:#7fe0b8}}
.medios{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.medios .stat{cursor:pointer}
.banco{font-weight:700;margin:12px 0 6px;font-size:14px}
.cta{display:flex;justify-content:space-between;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:14px;gap:8px}
.cta span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav{align-items:center;z-index:5}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 10px;cursor:pointer;min-width:62px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
nav button.fab{width:54px;height:54px;min-width:54px;border-radius:50%;background:var(--accent);color:#fff;margin-top:-26px;padding:0;justify-content:center;box-shadow:0 6px 16px rgba(36,99,235,.35);border:4px solid var(--bg)}
nav button.fab svg{width:26px;height:26px;stroke-width:2.4}
nav button.fab.on{color:#fff}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.badge.in{width:auto;padding:1px 7px;border:0;border-radius:10px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
.btn{width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;margin-top:16px}
.btn.sec{background:var(--chip);color:var(--text)}
.btn.del{background:none;color:var(--egr);margin-top:6px}
.row{display:flex;gap:8px}
.sync{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:8px}
.sync button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:13px}
.warn{background:#fff4e5;color:#8a4b00;border:1px solid #ffd8a8;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
@media (prefers-color-scheme: dark){.warn{background:#2a1f10;color:#ffcc80;border-color:#5a3d12}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 2px;font-size:17px}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#14202e;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.loading{text-align:center;color:var(--muted);padding:60px 0}
.fill.ok{background:var(--ing)}.fill.al{background:#e8a317}.fill.ex{background:#dc2626}
.pbadge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;margin-right:5px;font-weight:600;background:#ede9fe;color:#5b21b6}
@media (prefers-color-scheme: dark){.pbadge{background:#2e2350;color:#c4b5fd}}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:5px 0}
.kv span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.kv.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:9px;font-weight:700;font-size:16px}
.mini{font-size:12px;color:var(--muted)}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:13px;font-weight:600}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px}
.pcard{cursor:pointer}
.var{font-size:11px;font-weight:700;margin-left:6px;padding:1px 6px;border-radius:8px;background:var(--chip);color:var(--muted)}
.var.up{color:var(--egr)}.var.down{color:var(--ing)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px}
.cal-d{aspect-ratio:1;border:0;border-radius:8px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;padding:0;cursor:default;color:var(--text);min-width:0}
.cal-d small{font-size:9px;opacity:.85}
.cal-d[onclick]{cursor:pointer}.cal-d.fut{opacity:.4}
.n1{background:#fde4d6!important}.n2{background:#f9b994!important}.n3{background:#ee8250!important;color:#fff!important}.n4{background:#c2410c!important;color:#fff!important}
@media (prefers-color-scheme: dark){.n1{background:#4a2a1c!important}.n2{background:#7a3d20!important}.n3{background:#b4532a!important}.n4{background:#ff8a5c!important;color:#1a0d06!important}}
.legend i.n1,.legend i.n2,.legend i.n3,.legend i.n4{width:12px;height:12px;margin:0 1px}
.tabla{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;font-variant-numeric:tabular-nums}
.tabla th{text-align:right;color:var(--muted);font-weight:600;font-size:12px;padding:4px}.tabla th:first-child,.tabla td:first-child{text-align:left;text-transform:capitalize}
.tabla td{text-align:right;padding:6px 4px;border-top:1px solid var(--line)}.tabla tr[onclick]{cursor:pointer}
#pcCard{touch-action:pan-y;user-select:none;position:relative}
#pcHint{position:absolute;top:12px;right:14px;font-weight:700;color:var(--accent);opacity:0;pointer-events:none}
@media (min-width:700px){.stats.flujo{grid-template-columns:1.5fr 1fr 1fr}.stats{grid-template-columns:1fr 1fr 1fr}.stat.big{grid-column:auto}.stat.big b{font-size:22px}}
.hero{padding:18px 18px 14px}
.hero .hl{font-size:13px;color:var(--muted)}
.hero .hv{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0}
.hv.al{color:var(--warn)}
.hero .hs{font-size:14px}
.hero .hs b{font-variant-numeric:tabular-nums}
b.al,span.al{color:var(--warn)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pill{border:1px solid var(--line);background:var(--chip);border-radius:20px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--text)}
.pill b{font-variant-numeric:tabular-nums;margin-left:3px}
.hrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);margin-top:14px;padding-top:10px;font-size:12px;color:var(--muted)}
.hrow b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:none;color:var(--text)}
.alerta{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:10px;font-size:14px;margin-bottom:6px;cursor:pointer}
.alerta span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.alerta.ex{background:#fdecec;color:#a61b1b}.alerta.al{background:#fff4e0;color:#8a5300}
@media (prefers-color-scheme: dark){.alerta.ex{background:#3a1717;color:#ffb4b4}.alerta.al{background:#33260f;color:#ffd38a}}
.okmsg{margin-top:12px;font-size:13px;color:var(--ing);font-weight:600}
.prox{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.prox>div{flex:0 0 auto;min-width:96px;border-radius:12px;padding:9px 10px;background:var(--chip);text-align:center;font-size:12px}
.prox b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.prox .ico2{font-size:20px;line-height:1.3}
.prox .hoy{outline:2px solid var(--accent)}
.prox .atr{background:#fff4e0;color:#8a5300}.prox .tc{background:#fdecec;color:#a61b1b}.prox .ingr{background:#e3f6ec;color:#0b6b47}
@media (prefers-color-scheme: dark){.prox .atr{background:#33260f;color:#ffd38a}.prox .tc{background:#3a1717;color:#ffb4b4}.prox .ingr{background:#0f3324;color:#7fe0b8}}
.banner{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;cursor:pointer}
.banner b{font-size:15px}.banner .x{color:#fff;opacity:.8;margin-left:auto;font-size:16px}
.rcard{border-radius:14px;padding:14px;margin-bottom:10px;background:var(--chip)}
.rcard .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.rcard .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:4px}
details.pleg>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.pleg>summary::-webkit-details-marker{display:none}
details.pleg>summary h2{margin:0}
details.pleg>summary::after{content:'›';color:var(--muted);font-size:20px;line-height:1;transform:rotate(90deg);transition:transform .2s}
details.pleg[open]>summary::after{transform:rotate(-90deg)}
details.pleg[open]>summary{margin-bottom:10px}
.mbar{position:relative;height:8px;border-radius:5px;background:var(--chip);margin:14px 0 6px}
.mbar>div{height:100%;border-radius:5px}
.mbar>i{position:absolute;top:-4px;width:2px;height:16px;background:var(--text);opacity:.55;border-radius:1px}
.hfoot{display:flex;justify-content:space-between;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px 0 0;margin-top:14px;font-size:14px;color:var(--muted);cursor:pointer}
.hfoot b{color:var(--text);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;min-width:0}
.tile b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-variant-numeric:tabular-nums}
.card .pillb,.pillb{border:0;background:var(--accent);color:#fff;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
.upd{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 10px}
.act{font-size:11px;font-weight:500;color:var(--muted);background:var(--chip);border-radius:10px;padding:2px 8px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.sk{border-radius:16px;margin-bottom:12px;background:linear-gradient(90deg,var(--chip) 0%,var(--card) 50%,var(--chip) 100%);background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.alerta.info{background:var(--chip);color:var(--text)}
.alerta{margin-bottom:8px}
.logo{width:28px;height:28px;flex:none;border-radius:7px}
.wrap{padding-top:calc(16px + env(safe-area-inset-top))}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock .lockin{text-align:center;width:100%;max-width:300px}
#lock .logo{width:64px;height:64px;border-radius:16px}
#lock .dots{display:flex;gap:14px;justify-content:center;margin-bottom:22px}
#lock .dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--muted)}#lock .dots i.on{background:var(--text);border-color:var(--text)}
#lock .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
#lock .pad button{height:64px;border-radius:50%;border:0;background:var(--chip);font-size:24px;font-weight:600;cursor:pointer;color:var(--text)}
#lock .pad button:active{background:var(--line)}
.cols>div{min-width:0}
.narrow{max-width:760px;margin:0 auto}
/* ---- Ajuste celular ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.sheet{max-height:88dvh}
@media (max-width:999px){
  .wrap{padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right));padding-bottom:calc(120px + env(safe-area-inset-bottom))}
  input,select,textarea,.in,.search{font-size:16px}
}
@media (max-width:480px){
  header{margin-bottom:12px}
  h1{font-size:17px;gap:7px;min-width:0}
  .mes span{min-width:0;font-size:14px}
  .ajustes{flex-direction:column;align-items:stretch;text-align:center}
  .ajustes>span:last-child{display:grid!important;grid-template-columns:1fr 1fr;gap:8px}
  .ajustes button{padding:11px 8px;font-size:14px}
  .ajustes button:last-child:nth-child(odd){grid-column:1/-1}
}
.pillb{white-space:nowrap}
.alerta.txt span{white-space:normal;font-weight:400}
.cqm{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}.cqm .row{margin-top:6px;align-items:center}.cqm .in{margin-top:0}
#printArea{display:none}
@media print{body.imprimiendo>*:not(#printArea){display:none!important}body.imprimiendo #printArea{display:block!important;color:#000;background:#fff;font:12px/1.4 Inter,Arial,sans-serif}
  #printArea h1{font-size:20px;margin:0 0 10px}#printArea h2{font-size:14px;margin:16px 0 6px}#printArea table{width:100%;border-collapse:collapse}
  #printArea td,#printArea th{border-bottom:1px solid #ddd;padding:4px 6px;text-align:left}#printArea td:last-child,#printArea th:last-child{text-align:right}
  #printArea .pie{color:#666;margin-top:14px}.noprint{display:none!important}}
body.imprimiendo>*:not(#printArea){display:none!important}body.imprimiendo #printArea{display:block;padding:16px;background:var(--card)}
#printArea table{width:100%;border-collapse:collapse}#printArea td,#printArea th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}#printArea td:last-child,#printArea th:last-child{text-align:right}
@media (max-width:360px){
  h1{font-size:0;gap:0}
  .pillb{font-size:12px;padding:5px 9px}
  .mes span{font-size:13px}
}
@media (min-width:1000px){
  .wrap{max-width:1180px;padding:24px 28px 120px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}

}

<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)cerrar()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const ICONOS={'Reembolso':'↩️','Supermercado':'🛒','Comida y restaurantes':'🍽️','Delivery':'🛵','Transporte':'🚗','Servicios y cuentas':'💡',
  'Vivienda':'🏠','Salud':'💊','Compras':'🛍️','Suscripciones y entretención':'🎮','Viajes':'✈️','Educación':'📚',
  'Transferencias':'↗️','Otros':'•','Sueldo':'💼','Otros ingresos':'↙️','Movimiento interno':'🔁','Por clasificar':'❓'};
let D=null, vista='res', filtro='Todos', busca='', filtroCat='';
const hoy=new Date(); let mes=new Date(hoy.getFullYear(),hoy.getMonth(),1);

const fmt=n=>(n<0?'-':'')+'$'+Math.round(Math.abs(n)).toLocaleString('es-CL');
const clp=m=>m.moneda==='USD'?m.monto*(D.usdClp||950):m.monto;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mismoMes=(f,m)=>f.getFullYear()===m.getFullYear()&&f.getMonth()===m.getMonth();
const nombreMes=(m,corto)=>corto?m.toLocaleDateString('es-CL',{month:'short'}):m.toLocaleDateString('es-CL',{month:'long'})+' '+m.getFullYear();
function medioTipo(x){if(x.tipo==='Interno')return 'Traspaso';if(x.tipo==='Ingreso')return 'Ingreso';const m=String(x.medio||'');if(/cr[eé]dito|\bTC\b/i.test(m))return 'Crédito';if(/efectivo/i.test(m))return 'Efectivo';return 'Débito';}
const BADGE={'Crédito':'💳 Crédito','Débito':'🏦 Débito','Efectivo':'💵 Efectivo','Traspaso':'🔁 Traspaso','Ingreso':'⬇️ Ingreso'};
const BCLS={'Crédito':'cr','Débito':'de','Efectivo':'de','Traspaso':'tr','Ingreso':'in'};
function cuentaDe(x){const m=String(x.medio||'').split(' (vía')[0].replace(/\s*\*{2,}\d+$/,'');if(m.includes(' · '))return m;if(/efectivo/i.test(m))return 'Efectivo';if(/cr[eé]dito|\bTC\b/i.test(m))return 'Banco de Chile · Tarjeta de Crédito';return 'Banco de Chile · Cuenta Corriente';}
function cuentasLista(){const s=new Set((D.cuentas||[]).concat(['Efectivo']));D.movs.forEach(x=>s.add(cuentaDe(x)));return [...s].sort();}
let filtroCuenta='';

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
const ES_PWA=!(window.google&&google.script&&google.script.run);
function apiCfg(){try{return {u:localStorage.getItem('apiU'),k:localStorage.getItem('apiK')}}catch(e){return {}}}
function call(fn,...args){
  if(ES_PWA){const c=apiCfg();
    return fetch(c.u,{method:'POST',body:JSON.stringify({k:c.k,fn,args})}).then(r=>r.json())
      .then(j=>{if(j.error)throw new Error(j.error);return j.data})
      .catch(e=>{const m=String(e.message||e);toast(/Failed to fetch|NetworkError|Load failed/.test(m)?'Sin conexión':'Error: '+m);if(m==='No autorizado')pantallaVincular(true);throw e});}
  return new Promise((ok,err)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>{toast('Error: '+(e.message||e));err(e)})[fn](...args));
}
let _cacheT=null;
function guardarCache(){if(!D||D.__cache)return;clearTimeout(_cacheT);_cacheT=setTimeout(()=>{try{localStorage.setItem('cacheD',JSON.stringify(D))}catch(e){}},800)}
async function cargar(){
  try{const c=localStorage.getItem('cacheD');if(c){D=JSON.parse(c);D.__cache=true;render()}}catch(e){}
  try{const n=await call('getDatos');D=n;render()}catch(e){if(D)toast('Sin conexión: mostrando los últimos datos guardados')}
}
function ir(v){if(v!=='mov')filtroDia=0;if(v==='mov'&&vista!=='cat')filtroCat='';vista=v;if(v==='res'||v==='mov')proySel='';['res','mov','pro','ano','add'].forEach(x=>document.getElementById('nav-'+x).classList.toggle('on',x===v));render();window.scrollTo(0,0)}
function cambiarMes(d){filtroDia=0;mes=vista==='ano'&&anaModo==='anio'?new Date(mes.getFullYear()+d,mes.getMonth(),1):new Date(mes.getFullYear(),mes.getMonth()+d,1);render()}

// El sueldo que llega a fin de mes (día 20 en adelante) cuenta como ingreso del 1° del mes siguiente: los gastos se descuentan desde ahí.
function fechaEf(x){const f=new Date(x.fecha);if(x.tipo==='Ingreso'&&x.categoria==='Sueldo'&&f.getDate()>=20)return new Date(f.getFullYear(),f.getMonth()+1,1,0,0);return f}
function delMes(m){return D.movs.map(x=>({...x,f:fechaEf(x)})).filter(x=>mismoMes(x.f,m))}
function totales(lista){
  let ing=0,egr=0;
  lista.forEach(x=>{if(x.tipo==='Ingreso'&&x.categoria==='Reembolso')egr-=clp(x);else if(x.tipo==='Ingreso')ing+=clp(x);else if(x.tipo==='Egreso')egr+=clp(x)});
  return {ing,egr,bal:ing-egr};
}

// Saldo real de cada cuenta: el último saldo que ingresaste (el que ves en el banco) ± los movimientos posteriores.
function ctasSaldo(){return cuentasLista().filter(c=>c!=='Efectivo'&&!/Tarjeta de Cr/i.test(c));}
function saldoCta(c){
  const a=(D.saldos||{})[c];if(!a)return null;
  const t0=new Date(a.fecha);let s=Number(a.saldo)||0;
  D.movs.forEach(x=>{
    if(new Date(x.fecha)<=t0)return;
    const m=clp(x),k=cuentaDe(x),d=String(x.descripcion||'');
    if(x.tipo==='Interno'){
      if(d.includes('→')){const p=d.replace(/^Traspaso\s*/i,'').split('→').map(t=>t.trim());if(p[0]&&c.endsWith(p[0]))s-=m;else if(!p[0]&&k===c)s-=m;if(p[1]&&c.endsWith(p[1]))s+=m;}
      else if(k===c){if(/desde|Uso l[ií]nea/i.test(d))s+=m;else s-=m;}
    }else if(k===c&&medioTipo(x)!=='Crédito')s+=x.tipo==='Ingreso'?m:-m;
  });
  return {s,base:Number(a.saldo)||0,f:t0};
}
function editSaldo(i){
  const c=ctasSaldo()[i],v=saldoCta(c);
  document.getElementById('sheet').innerHTML=`<h3>Saldo de ${esc(c)}</h3>
    <div class="mini">Escribe el saldo que ves ahora en el banco. Desde ahí sumo y resto los movimientos que lleguen por correo.${v?` Último ajuste: ${v.f.toLocaleString('es-CL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}.`:''}</div>
    <label>Saldo actual</label><input class="in" id="esv" inputmode="numeric" value="${v?Math.round(v.s):''}" placeholder="0">
    <button class="btn" onclick="guardaSaldo(${i},this)">Guardar</button><button class="btn sec" onclick="cerrar()">Cancelar</button>`;
  document.getElementById('sheetBg').classList.add('show');setTimeout(()=>{const e=document.getElementById('esv');e.focus();e.select()},60);
}
async function guardaSaldo(i,b){const v=document.getElementById('esv').value.replace(/[^\d-]/g,'');if(v===''){toast('Escribe el saldo');return}
  b.disabled=true;b.textContent='Guardando…';try{D=await call('guardarSaldo',ctasSaldo()[i],Number(v));cerrar();render();toast('Saldo actualizado')}catch(e){b.disabled=false;b.textContent='Guardar'}}

function render(){
  document.getElementById('mesTxt').textContent=vista==='ano'&&anaModo==='anio'?'Año '+mes.getFullYear():nombreMes(mes);
  const ac=document.getElementById('act');if(ac)ac.style.display=D&&D.__cache?'':'none';
  if(!D) return;
  const v=document.getElementById('vista');
  document.querySelector('.mes').style.visibility=vista==='pro'||vista==='add'?'hidden':'visible';
  v.className = vista==='res'||vista==='ano'||(vista==='pro'&&!proySel)?'':'narrow';
  v.innerHTML = vista==='cat'?vCategoria(): vista==='res'?vResumen(): vista==='mov'?vMovs(): vista==='pro'?vProyectos(): vista==='ano'?vAnalisis(): vAgregar();
  if(vista==='add') initAgregar();
  if(vista==='res'||vista==='mov') initSwipe();
  guardarCache();
}

/* Flujo de caja real: lo que entró y salió de las cuentas (sin compras con tarjeta, con pagos de deuda) */
function flujoMes(L){
  const sum=a=>a.reduce((t,x)=>t+clp(x),0), tc=x=>medioTipo(x)==='Crédito';
  const entro=sum(L.filter(x=>x.tipo==='Ingreso'&&x.categoria!=='Reembolso')), reemb=sum(L.filter(x=>x.tipo==='Ingreso'&&x.categoria==='Reembolso'));
  const gastos=sum(L.filter(x=>x.tipo==='Egreso'&&!tc(x)));
  const pagos=sum(L.filter(x=>x.tipo==='Interno'&&/pago\s+(de\s+)?(la\s+)?(tarjeta|l[ií]nea)/i.test(x.descripcion)));
  const linea=sum(L.filter(x=>x.tipo==='Interno'&&/uso\s+l[ií]nea/i.test(x.descripcion)));
  return {entro,reemb,gastos,pagos,linea,tc:sum(L.filter(x=>x.tipo==='Egreso'&&tc(x))),queda:entro+reemb-gastos-pagos};
}
function analisisMesHTML(){
  const L=delMes(mes), T=totales(L);
  const porCat={};
  const subs={};
  L.filter(x=>x.tipo==='Egreso').forEach(x=>{const p=padre(x.categoria);porCat[p]=(porCat[p]||0)+clp(x);if(esSub(x.categoria)){const n=subNom(x.categoria);subs[p]=subs[p]||{};subs[p][n]=(subs[p][n]||0)+clp(x)}});
  const cats=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const max=cats.length?cats[0][1]:1;
  const totCat=cats.reduce((a,c)=>a+c[1],0)||1;
  const ant=gastoPorCat(new Date(mes.getFullYear(),mes.getMonth()-1,1));
  const reemb=L.filter(x=>x.tipo==='Ingreso'&&x.categoria==='Reembolso').reduce((a,x)=>a+clp(x),0);
  const otros=L.filter(x=>x.tipo==='Egreso'&&x.categoria==='Otros').sort((a,b)=>clp(b)-clp(a)).slice(0,10);
  const sug=sugerirReembolsos();
  const deu=deudas();
  // tendencia 6 meses
  const meses=[];for(let i=5;i>=0;i--)meses.push(new Date(mes.getFullYear(),mes.getMonth()-i,1));
  const tr=meses.map(m=>({m,...totales(delMes(m))}));
  const tmax=Math.max(1,...tr.map(t=>Math.max(t.ing,t.egr)));
  const top=L.filter(x=>x.tipo==='Egreso').sort((a,b)=>clp(b)-clp(a)).slice(0,5);
  const pm={},pc={};L.filter(x=>x.tipo==='Egreso').forEach(x=>{const k=medioTipo(x);pm[k]=(pm[k]||0)+clp(x);pc[k]=(pc[k]||0)+1});
  const TR=L.filter(x=>x.tipo==='Interno'),tt=TR.reduce((a,x)=>a+clp(x),0);
  const medios=['Crédito','Débito'].concat(pm['Efectivo']?['Efectivo']:[]);
  const PC={};L.forEach(x=>{if(x.tipo==='Interno')return;const k=cuentaDe(x);PC[k]=PC[k]||{g:0,i:0};if(x.tipo==='Egreso')PC[k].g+=clp(x);else PC[k].i+=clp(x)});
  const bancos={};Object.keys(PC).sort().forEach(k=>{const p=k.includes(' · ')?k.split(' · '):[k,k];(bancos[p[0]]=bancos[p[0]]||[]).push([p[1],k])});
  const ult=D.ultimaRevision?new Date(D.ultimaRevision).toLocaleString('es-CL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'nunca';
  const A=`
  ${D.sinProcesar?`<div class="warn">Hay ${D.sinProcesar} aviso(s) del banco que no pude leer. Revísalos en la hoja «Sin procesar» de tu planilla.</div>`:''}
  ${esteMes()?heroHTML(T):`<div class="stats">
    <div class="stat big"><small>Resultado del mes</small><b class="${T.bal>=0?'ing':'egr'}">${fmt(T.bal)}</b></div>
    <div class="stat"><small>Ingresos</small><b class="ing">${fmt(T.ing)}</b></div>
    <div class="stat"><small>Gastos</small><b class="egr">${fmt(T.egr)}</b></div>
  </div>`}
  ${esteMes()?bannerResumenHTML():''}
  ${esteMes()?proximosHTML():''}
  ${pendientesHTML()}
  ${presupuestosHTML()}
  ${sug.map((g,i)=>`<div class="card" style="border-color:#f5c26b"><h2>¿Son reembolsos?</h2>
    <div style="font-size:14px;margin-bottom:8px">${g.length} personas te transfirieron ${fmt(g[0].monto)} el ${new Date(g[0].fecha).toLocaleDateString('es-CL',{day:'numeric',month:'long'})}: ${g.map(x=>esc(x.descripcion.replace('Transf. de ',''))).join(', ')}. Si te devolvieron plata de una cuenta compartida, no son ingresos.</div>
    <div class="row"><button class="btn" style="margin-top:0" onclick="marcarReembolso(${i},true,this)">Sí, son reembolsos</button><button class="btn sec" style="margin-top:0" onclick="marcarReembolso(${i},false,this)">No, son ingresos</button></div></div>`).join('')}
  <div class="card"><h2>Deuda actual</h2>
    <div class="cta" style="cursor:default"><span>Tarjeta de crédito ****7796</span><b class="egr">${deu.tc?fmt(deu.tc.total):'Sin datos'}</b></div>
    ${D.planTarjeta?`<div class="cta" onclick="proySel='';ir('pro')" style="margin-top:-2px"><span>📉 Plan de pago: $0 en ${mesK(calcPlan(D.planTarjeta,D.planTarjeta.extra).fin)}</span><span class="link">Ver plan ›</span></div>`:''}
    ${deu.tc?`<div style="font-size:12px;color:var(--muted);margin:-2px 4px 8px">Saldo informado por el banco al pagar el ${deu.tc.f} (${fmt(deu.tc.base)}) + compras posteriores (${fmt(deu.tc.nuevas)}). Estimado.</div>`:''}
    <div class="cta" style="cursor:default"><span>Línea de crédito</span><b class="${deu.linea&&deu.linea.base?'egr':'ing'}">${deu.linea?fmt(deu.linea.base):'Sin datos'}</b></div>
    ${deu.linea?`<div style="font-size:12px;color:var(--muted);margin:-2px 4px 0">Utilizado según tu último pago (${deu.linea.f}). El uso posterior no llega por correo.</div>`:''}
    ${cuotasHTML()}
  </div>`;
  const B=`
  ${pleg('cat','Gastos por categoría',`${comparaHTML(T)}
    ${cats.length?cats.map(([c,v])=>`<div class="bar" onclick="verCat('${esc(c)}')">
      <div class="t"><span>${ico(c)} ${esc(c)}${variacion(v,ant[c]||0)}</span><span>${fmt(v)} · ${Math.round(v/totCat*100)}%</span></div>
      <div class="track"><div class="fill" style="width:${v/max*100}%;background:${colorCat(c)}"></div></div>${subsHTML(subs[c],v)}</div>`).join(''):'<div class="empty">Sin gastos este mes</div>'}
    ${reemb?`<div class="sync" style="margin-top:10px"><span>↩️ Reembolsos recibidos (ya descontados del gasto)</span><b class="ing">-${fmt(reemb)}</b></div>`:''}
    ${cats.length&&Object.keys(ant).length?'<div class="mini" style="margin-top:6px">↑↓ comparado con el mes anterior.</div>':''}`)}
  ${esteMes()?plegCard('proy',proyeccionHTML(T)):''}
  ${plegCard('fijos',fijosHTML())}
  ${suscripcionesHTML()}
  ${plegCard('cal',calendarioHTML(L))}
<!--COL-->
  ${pleg('top','Mayores gastos del mes',top.length?top.map(itemHTML).join(''):'<div class="empty">—</div>')}
  ${pleg('tend','Últimos 6 meses',`<div class="trend">${tr.map(t=>`<div class="col"><div class="pair">
      <div style="height:${t.ing/tmax*100}%;background:var(--ing)" title="Ingresos ${fmt(t.ing)}"></div>
      <div style="height:${t.egr/tmax*100}%;background:var(--egr)" title="Gastos ${fmt(t.egr)}"></div></div>
      <small>${nombreMes(t.m,true)}</small></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--ing)"></i>Ingresos</span><span><i style="background:var(--egr)"></i>Gastos</span></div>`)}
  ${pleg('medios','Gastos por medio de pago',`<div class="medios">
    ${medios.map(k=>`<div class="stat" onclick="verMedio('${k}')"><small><span class="badge ${BCLS[k]}">${BADGE[k]}</span></small><b class="egr">${fmt(pm[k]||0)}</b><small>${pc[k]||0} movimiento(s)</small></div>`).join('')}
    </div>
    <div class="cta" style="margin-top:10px" onclick="verMedio('Traspaso')"><span>🔁 ${TR.length} traspaso(s) entre cuentas y pagos de tarjeta (no son gasto)</span><b>${fmt(tt)}</b></div>`)}
  ${pleg('bancos','Por banco y cuenta',Object.entries(bancos).map(([b,cs])=>`<div class="banco">${esc(b)}</div>${cs.map(([c,k])=>`<div class="cta" onclick="verCuenta('${esc(k)}')"><span>${esc(c)}</span><span><span class="ing">${PC[k].i?'+'+fmt(PC[k].i):''}</span> <span class="egr">${PC[k].g?'-'+fmt(PC[k].g):''}</span></span></div>`).join('')}`).join('')||'<div class="empty">Sin movimientos</div>')}
  <div class="card sync ajustes"><span>Correo revisado: ${ult}</span>
    <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${ES_PWA?'<button onclick="verSeguridad()">🔒 Seguridad</button>':'<button onclick="instalarApp(this)">📱 Instalar app</button>'}<button onclick="verCuadre()">🧮 Cuadrar</button><button onclick="verExportar()">⬇️ Exportar</button><button onclick="verResumenMes(-1)">📊 Resumen</button><button onclick="cambiarTema()">${TEMAS[tema]}</button><button onclick="verCategorias()">🏷️ Categorías</button><button onclick="sincronizar(this)">↻ Revisar</button></span></div>`;
  const F=flujoMes(L);
  return `<div class="stats flujo">
    <div class="stat big"><small>Plata que te quedó</small><b class="${F.queda>=0?'ing':'egr'}">${F.queda>0?'+':''}${fmt(F.queda)}</b>
      <div style="margin-top:8px">
        <div class="kv"><span>Entró a tus cuentas</span><span class="ing">+${fmt(F.entro)}</span></div>
        ${F.reemb?`<div class="kv"><span>Te pagaron lo que te debían</span><span class="ing">+${fmt(F.reemb)}</span></div>`:''}
        <div class="kv" onclick="verMedio('Débito')" style="cursor:pointer"><span>Gastos con débito y efectivo ›</span><span class="egr">−${fmt(F.gastos)}</span></div>
        <div class="kv" onclick="verMedio('Traspaso')" style="cursor:pointer"><span>Pagos de tarjeta y línea ›</span><span class="egr">−${fmt(F.pagos)}</span></div>
      </div>
      ${F.linea?`<div class="mini" style="margin-top:4px">⚠️ Además usaste ${fmt(F.linea)} de la línea de crédito para cubrir gastos cuando la cuenta quedó en cero (es deuda nueva).</div>`:''}
      <small style="margin-top:6px">Es lo que debería cuadrar con tu banco: cuánto subió o bajó la plata en tus cuentas este mes.${F.tc?` Las compras con tarjeta (${fmt(F.tc)}) salen de tu cuenta recién cuando pagas la factura.`:''}</small></div>
    <div class="stat"><small>Ingresos</small><b class="ing">${fmt(T.ing)}</b></div>

/* ---- Presupuestos ---- */
function gastoCats(m){ // igual que el servidor: sin proyectos; reembolsos descuentan el total
  const g={Total:0};
  delMes(m).filter(sinProy).forEach(x=>{if(x.tipo==='Egreso'){const c=x.categoria,p=padre(c);g[p]=(g[p]||0)+clp(x);if(p!==c)g[c]=(g[c]||0)+clp(x);g.Total+=clp(x)}else if(x.tipo==='Ingreso'&&x.categoria==='Reembolso')g.Total-=clp(x)});
  return g;
}
function barra(nombre,gastado,tope,click){
  const p=tope?gastado/tope*100:0, cls=p>=100?'ex':p>=80?'al':'ok';
  const resto=tope-gastado;
  return `<div class="bar" ${click?`onclick="${click}"`:''}><div class="t"><span>${nombre}</span><span>${fmt(gastado)} / ${fmt(tope)}</span></div>
    <div class="track"><div class="fill ${cls}" style="width:${Math.min(100,p)}%"></div></div>
    <div class="mini" style="margin-top:2px">${resto>=0?`Te quedan ${fmt(resto)} · ${Math.round(p)}%`:`<b style="color:#dc2626">Te pasaste por ${fmt(-resto)}</b>`}</div></div>`;
}

function promedioCat(){ // promedio de los 3 meses anteriores con datos
  const s={},ms=[];
  for(let i=1;i<=3;i++){const m=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);if(delMes(m).length)ms.push(m)}
  ms.forEach(m=>{const g=gastoCats(m);Object.keys(g).forEach(k=>s[k]=(s[k]||0)+g[k])});
  Object.keys(s).forEach(k=>s[k]=ms.length?s[k]/ms.length:0);
  return s;
}

/* ---- Sueldo y gastos fijos ---- */
const claveFijo=x=>x.tipo==='Ingreso'&&x.categoria==='Sueldo'?'I|SUELDO':x.tipo[0]+'|'+String(x.descripcion).toUpperCase().replace(/[\d*#.,\/-]+/g,' ').replace(/\s+/g,' ').trim();
function fijos(){
  const ini=new Date(hoy.getFullYear(),hoy.getMonth()-4,1);
  const ign=new Set(D.fijosIgnorados||[]);
  const g={};
  D.movs.forEach(x=>{if(x.tipo==='Interno'||x.proyecto||x.categoria==='Reembolso')return;const f=fechaEf(x);if(f<ini)return;
    const k=claveFijo(x);if(ign.has(k))return;(g[k]=g[k]||[]).push({...x,f})});
  const ym=f=>f.getFullYear()*12+f.getMonth(), act=ym(hoy);
  const out=[];
  Object.entries(g).forEach(([k,L])=>{
    const pm={};L.forEach(x=>{const m=ym(x.f);(pm[m]=pm[m]||[]).push(x)});
    const meses=Object.keys(pm).map(Number);
    const previos=meses.filter(m=>m<act);
    if(k!=='I|SUELDO'){
      if(['Supermercado','Delivery','Comida y restaurantes','Intereses y comisiones'].includes(padre(L[0].categoria)))return;   // gasto del día a día
      const fija=['Servicios y cuentas','Suscripciones y entretención','Vivienda','Educación','Salud'].includes(L[0].categoria);
      if(meses.length<(fija?2:3)||!previos.length)return;
      if(Object.values(pm).some(a=>a.length>2))return;                 // compras frecuentes (bencina, súper): no son fijos
      const v=L.map(clp),mx=Math.max(...v),mn=Math.min(...v);if(mn<=0||mx/mn>1.6)return;
    }else if(!previos.length)return;
    L.sort((a,b)=>b.f-a.f);
    const ult=L.find(x=>ym(x.f)<act)||L[0];
    const pagado=pm[act]?pm[act].reduce((a,x)=>a+clp(x),0):0;
    out.push({k,tipo:L[0].tipo,desc:k==='I|SUELDO'?'Sueldo':L[0].descripcion,monto:clp(ult),dia:ult.f.getDate(),pagado,meses:meses.length,cat:L[0].categoria});
  });
  return out.sort((a,b)=>a.tipo===b.tipo?a.dia-b.dia:a.tipo==='Ingreso'?-1:1);
}
function fijosHTML(){
  if(!esteMes())return '';
  const F=fijos();if(!F.length)return '';
  const fila=f=>`<div class="kv"><span>${f.tipo==='Ingreso'?'💼':ico(f.cat)} ${esc(f.desc)} <span class="mini">· día ${f.dia}</span></span>
    <span>${f.pagado?`<span class="${f.tipo==='Ingreso'?'ing':'egr'}">✓ ${fmt(f.pagado)}</span>`:`<span class="mini">pendiente</span> ${fmt(f.monto)}`}
    <button class="x" title="No es fijo" onclick="noFijo('${esc(f.k)}',this)">✕</button></span></div>`;

}

/* ---- Proyección fin de mes ---- */
function proyeccion(T){
  const F=fijos();
  const ingP=F.filter(f=>f.tipo==='Ingreso'&&!f.pagado).reduce((a,f)=>a+f.monto,0);
  const egrP=F.filter(f=>f.tipo==='Egreso'&&!f.pagado).reduce((a,f)=>a+f.monto,0);
  const kf=new Set(F.filter(f=>f.tipo==='Egreso').map(f=>f.k));
  const varMes=m=>delMes(m).filter(x=>x.tipo==='Egreso'&&sinProy(x)&&!kf.has(claveFijo(x))).reduce((a,x)=>a+clp(x),0);
  const ms=[];for(let i=1;i<=3;i++){const m=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);if(delMes(m).length)ms.push(m)}
  const diario=ms.length?ms.reduce((a,m)=>a+varMes(m)/new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),0)/ms.length:0;
  const dias=new Date(hoy.getFullYear(),hoy.getMonth()+1,0).getDate()-hoy.getDate();
  const variable=diario*dias;
  const varHoy=varMes(hoy), ritmo=hoy.getDate()?varHoy/hoy.getDate():0;
  return {ingP,egrP,variable,dias,diario,ritmo,fin:T.bal+ingP-egrP-variable};
}
function proyeccionHTML(T){
  const p=proyeccion(T);
  const comp=p.diario?Math.round((p.ritmo/p.diario-1)*100):0;
  return `<div class="card"><h2>Así terminarías el mes</h2>
    <div class="kv"><span>Resultado a hoy</span><span class="${T.bal>=0?'ing':'egr'}">${fmt(T.bal)}</span></div>
    ${p.ingP?`<div class="kv"><span>+ Sueldo e ingresos fijos por llegar</span><span class="ing">+${fmt(p.ingP)}</span></div>`:''}
    ${p.egrP?`<div class="kv"><span>− Gastos fijos por pagar</span><span class="egr">-${fmt(p.egrP)}</span></div>`:''}
    <div class="kv"><span>− Gasto del día a día (${p.dias} días × ${fmt(p.diario)})</span><span class="egr">-${fmt(p.variable)}</span></div>
    <div class="kv tot"><span>Estimado al ${new Date(hoy.getFullYear(),hoy.getMonth()+1,0).getDate()} de ${hoy.toLocaleDateString('es-CL',{month:'long'})}</span><span class="${p.fin>=0?'ing':'egr'}">${fmt(p.fin)}</span></div>
    ${p.diario&&hoy.getDate()>=3?`<div class="mini" style="margin-top:6px">Este mes vas gastando ${fmt(p.ritmo)} al día en el día a día, ${comp>=0?comp+'% más':(-comp)+'% menos'} que tu promedio.</div>`:''}
  </div>`;
}

/* ---- Cuotas ---- */
function planCuota(c){
  const r=c.tasa/100, vc=r?c.monto*r/(1-Math.pow(1+r,-c.n)):c.monto/c.n;
  let y,m;
  if(/^\d{4}-\d{2}$/.test(c.primera)){[y,m]=c.primera.split('-').map(Number);m--}else{const f=new Date(c.fecha+'T12:00');y=f.getFullYear();m=f.getMonth()+1}
  const ini=y*12+m, act=hoy.getFullYear()*12+hoy.getMonth();
  const pagadas=Math.max(0,Math.min(c.n,act-ini)), restantes=c.n-pagadas, fin=ini+c.n-1;
  return {...c,vc,pagadas,restantes,pendiente:vc*restantes,ini,fin,finTxt:mesTxt(Math.floor(fin/12),fin%12)};
}
function cuotasHTML(){
  const C=(D.cuotas||[]).map(planCuota).filter(c=>c.restantes>0);
  if(!C.length)return '';
  const act=hoy.getFullYear()*12+hoy.getMonth();
  const enMes=k=>C.filter(c=>k>=c.ini&&k<=c.fin).reduce((a,c)=>a+c.vc,0);
  const prox=[0,1,2,3].map(i=>[act+i,enMes(act+i)]);
  const tot=C.reduce((a,c)=>a+c.pendiente,0);
  return `<div class="banco" style="margin-top:14px">Compras en cuotas</div>
    ${C.map(c=>`<div class="cta" style="cursor:default"><span>${esc(c.descripcion)}<br><span class="mini">${fmt(c.monto)} en ${c.n} cuotas${c.tasa?' · '+String(c.tasa).replace('.',',')+'% mensual':' sin interés'} · ${c.pagadas}/${c.n} pagadas · hasta ${c.finTxt}</span></span><span><b>${fmt(c.vc)}</b><span class="mini">/mes</span></span></div>`).join('')}
    <div class="kv"><span>Cuotas por pagar (incluidas en la deuda)</span><b class="egr">${fmt(tot)}</b></div>
    <div class="mini">Por mes: ${prox.map(([k,v])=>`${mesTxt(Math.floor(k/12),k%12)} <b>${fmt(v)}</b>`).join(' · ')}</div>`;
}

  let gasto=0,usd=0;const cat={};
  L.forEach(x=>{if(x.tipo==='Egreso'){gasto+=clp(x);cat[x.categoria]=(cat[x.categoria]||0)+clp(x);if(x.moneda==='USD')usd+=x.monto}else if(x.tipo==='Ingreso'&&x.categoria==='Reembolso')gasto-=clp(x)});

}

/* ---- Plan de pago de la tarjeta ---- */
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function calcPlan(pl,extra){
  const base=pl.deuda+(pl.cargos||0), ini=new Date(pl.inicio+'T12:00'), m0=ini.getFullYear()*12+ini.getMonth();
  const filas=[];let saldo=base,i=1;
  while(saldo>0&&i<=60){const pago=Math.min(extra,saldo);saldo-=pago;filas.push({k:m0+i,pago,saldo});i++}
  return {base,filas,fin:filas.length?filas[filas.length-1].k:m0};
}
const mesK=k=>MESES[k%12]+' '+Math.floor(k/12);
function planTarjetaHTML(){
  const pl=D.planTarjeta;if(!pl)return '';
  const c=calcPlan(pl,pl.extra), deu=deudas(), real=deu.tc?deu.tc.total:null;
  const act=hoy.getFullYear()*12+hoy.getMonth(), ini=new Date(pl.inicio+'T12:00');
  const pagos=D.movs.filter(x=>x.tipo==='Interno'&&/Pago tarjeta/i.test(x.descripcion)&&new Date(x.fecha)>=ini);
  const pagMes=pagos.filter(x=>mismoMes(new Date(x.fecha),hoy)).reduce((a,x)=>a+clp(x),0);
  const pj=(D.proyectos||[]).find(x=>x.nombre===pl.cargosNota);
  const hechos=pl.cargos?Math.min(pl.cargos,pj?resumenProy(pj).gasto:pl.cargos):0, faltan=(pl.cargos||0)-hechos;   // cargos del viaje que aún no ocurren
  const vencidas=c.filas.filter(f=>f.k<=act), esperado=(vencidas.length?vencidas[vencidas.length-1].saldo:c.base)-faltan;

function comparaHTML(T){
  const ant=new Date(mes.getFullYear(),mes.getMonth()-1,1), Ta=totales(delMes(ant));
  if(!Ta.egr)return '';
  const dia=esteMes()?hoy.getDate():null;

function sugerirCat(x){
  const k=claveSug(x.descripcion),cnt={};
  if(k)D.movs.forEach(z=>{if(z.categoria==='Por clasificar'||z.tipo!==x.tipo||z.id===x.id)return;if((' '+normJS(z.descripcion)+' ').includes(' '+normJS(k)+' '))cnt[z.categoria]=(cnt[z.categoria]||0)+1});
  const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  if(best)return best[0];
  // sin parecidos: la categoría que más usas para montos similares
  const c2={};D.movs.forEach(z=>{if(z.categoria==='Por clasificar'||z.tipo!==x.tipo||['Movimiento interno','Otros'].includes(z.categoria))return;const r=clp(z)/Math.max(1,clp(x));if(r>.5&&r<2)c2[z.categoria]=(c2[z.categoria]||0)+1});
  const b2=Object.entries(c2).sort((a,b)=>b[1]-a[1])[0];
  return b2?b2[0]:'';
}

/* ===================== B4 · ¿Cuándo llega a $0 la cuenta corriente? ===================== */
function ceroCC(){
  const c=ctaCC();if(!c||!esteMes())return null;const v=saldoCta(c);if(!v)return null;
  const fin=new Date(hoy.getFullYear(),hoy.getMonth()+1,0).getDate(), d0=hoy.getDate();
  const F=fijos(), kf=new Set(F.filter(f=>f.tipo==='Egreso').map(f=>f.k));
  const t60=new Date(hoy.getTime()-60*864e5);
  const vari=D.movs.filter(x=>x.tipo==='Egreso'&&cuentaDe(x)===c&&medioTipo(x)!=='Crédito'&&!x.proyecto&&!kf.has(claveFijo(x))&&clp(x)<150000&&new Date(x.fecha)>=t60&&new Date(x.fecha)<hoy).reduce((a,x)=>a+clp(x),0);
  const diario=vari/60;
  const fijosCC=F.filter(f=>f.tipo==='Egreso'&&!f.pagado&&f.dia>d0).filter(f=>{const m=D.movs.slice().reverse().find(x=>claveFijo(x)===f.k);return m&&cuentaDe(m)===c});
  let s=v.s,dia=null;
  for(let d=d0+1;d<fin;d++){s-=diario;fijosCC.filter(f=>Math.min(f.dia,fin)===d).forEach(f=>s-=f.monto);if(s<0&&dia===null)dia=d}
  if(dia===null)return {ok:true,s,diario};
  const dias=Math.max(1,fin-d0-1);
  return {ok:false,dia,s,diario,recorte:Math.ceil(-s/dias/100)*100,saldo:v.s};
}

/* ===================== D10 · Suscripciones y pagos recurrentes ===================== */
function suscripciones(){
  const ini=new Date(hoy.getFullYear(),hoy.getMonth()-6,1), g={}, ym=f=>f.getFullYear()*12+f.getMonth();
  const DIA=['Supermercado','Delivery','Comida y restaurantes','Transporte','Compras','Transferencias','Cancha',CAT_INT,'Gastos de Trabajo','Viajes','Reembolso','Por clasificar','Otros'];
  D.movs.forEach(x=>{if(x.tipo!=='Egreso'||x.proyecto||DIA.includes(padre(x.categoria)))return;const f=new Date(x.fecha);if(f<ini)return;(g[claveFijo(x)]=g[claveFijo(x)]||[]).push({...x,f})});
  const out=[];
  Object.values(g).forEach(L=>{
    const pm={};L.forEach(x=>{(pm[ym(x.f)]=pm[ym(x.f)]||[]).push(x)});
    if(Object.keys(pm).length<2||Object.values(pm).some(a=>a.length>2))return;
    const v=L.map(clp),mx=Math.max(...v),mn=Math.min(...v);if(mn<=0||mx/mn>1.5)return;
    L.sort((a,b)=>b.f-a.f);const u=L[0],dias=(hoy-u.f)/864e5;
    out.push({desc:u.descripcion,cat:u.categoria,monto:clp(u),anual:clp(u)*12,ult:u.f,activa:dias<=45,meses:Object.keys(pm).length,usd:u.moneda==='USD'});
  });
  return out.sort((a,b)=>b.activa-a.activa||b.monto-a.monto);
}
function suscripcionesHTML(){
  const S=suscripciones();if(!S.length)return '';
  const A=S.filter(s=>s.activa),m=A.reduce((a,s)=>a+s.monto,0);
  return pleg('subs','Suscripciones y pagos recurrentes',`
    <div class="sync" style="color:var(--text);margin-bottom:6px"><span class="mini">${A.length} activos</span><span><b class="egr">${fmt(m)}</b><span class="mini">/mes · ${fmt(m*12)} al año</span></span></div>
    ${S.map(s=>`<div class="kv" style="${s.activa?'':'opacity:.55'}"><span style="min-width:0">${ico(s.cat)} ${esc(s.desc)}<br><span class="mini">${s.activa?`≈ ${fmt(s.anual)} al año`:'¿cancelada? no se cobra hace más de 45 días'} · último ${fCorta(s.ult)}${s.usd?' · en US$':''}</span></span><b class="egr" style="white-space:nowrap">${fmt(s.monto)}</b></div>`).join('')}

}

function descargar(nombre,texto,tipo){
  const blob=new Blob([texto],{type:tipo});
  try{const file=new File([blob],nombre,{type:tipo});if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:nombre}).catch(()=>{});return}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}
function exportarCSV(){
  const L=delMes(mes).sort((a,b)=>a.f-b.f), q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const filas=[['Fecha','Tipo','Descripción','Categoría','Cuenta','Medio','Monto','Nota','Proyecto']].concat(L.map(x=>[isoLocal(x.fecha),x.tipo==='Egreso'?'Gasto':x.tipo==='Ingreso'?(x.categoria==='Reembolso'?'Reembolso':'Ingreso'):'Traspaso',x.descripcion,x.categoria,cuentaDe(x),medioTipo(x),Math.round((x.tipo==='Egreso'?-1:1)*clp(x)),x.nota,x.proyecto]));
  descargar(`mis-finanzas-${mes.getFullYear()}-${String(mes.getMonth()+1).padStart(2,'0')}.csv`,'﻿'+filas.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8');
  toast('Archivo listo ✓');
}
function exportarPDF(){
  const L=delMes(mes).sort((a,b)=>a.f-b.f), T=totales(L), F=flujoMes(L), cats={};
  L.filter(x=>x.tipo==='Egreso').forEach(x=>{const p=padre(x.categoria);cats[p]=(cats[p]||0)+clp(x)});
  const C=Object.entries(cats).sort((a,b)=>b[1]-a[1]);

    <h2>Gastos por categoría</h2><table>${C.map(([c,v])=>`<tr><td>${esc(c)}</td><td>${fmt(v)}</td><td>${Math.round(v/Math.max(1,T.egr+(F.reemb||0))*100)}%</td></tr>`).join('')}</table>
    <h2>Movimientos</h2><table class="mv"><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Cuenta</th><th>Monto</th></tr>${L.map(x=>`<tr><td>${fCorta(x.fecha)}</td><td>${esc(x.descripcion)}</td><td>${esc(x.categoria)}</td><td>${esc(corto(cuentaDe(x)))}</td><td>${x.tipo==='Egreso'?'−':x.tipo==='Ingreso'?'+':''}${fmt(clp(x))}</td></tr>`).join('')}</table>
    <button class="btn noprint" onclick="document.body.classList.remove('imprimiendo')">Volver a la app</button><p class="pie">Generado el ${new Date().toLocaleString('es-CL')} · Mis Finanzas</p>`;

  document.getElementById('vista').innerHTML=`<div class="card" style="max-width:460px;margin:30px auto;text-align:center">
    <div style="width:72px;margin:0 auto 10px">${LOGO_SVG}</div><h2 style="font-size:20px">${err?'Hay que volver a vincular este teléfono':'Vincula este teléfono'}</h2>
    <p class="mini" style="font-size:14px;text-align:left;line-height:1.5">1. Abre Mis Finanzas en su versión de Google (el enlace de siempre).<br>2. Ve a <b>Análisis</b> y, al final, toca <b>📱 Instalar app</b>.<br>3. Se abrirá esta app ya vinculada. Si prefieres, toca «Copiar código» allá y pégalo aquí:</p>
    <input class="in" id="codigoV" placeholder="Pega aquí el código"><input class="in" id="apiV" style="margin-top:8px" placeholder="Pega aquí la dirección del servidor">
    <button class="btn" onclick="vincularManual()">Vincular</button></div>`;
}
function vincularManual(){const k=document.getElementById('codigoV').value.trim(),u=document.getElementById('apiV').value.trim();
  if(!k||!/^https:\/\/script\.google\.com\//.test(u)){toast('Revisa el código y la dirección');return}
  localStorage.setItem('apiK',k);localStorage.setItem('apiU',u);location.reload()}

/* --- Bloqueo con PIN y Face ID (WebAuthn, solo en este dispositivo) --- */
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function hashPin(p){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p+'|misfinanzas'));return b64u(d)}
const bloqueoActivo=()=>!!lsGet('pinHash');
async function faceIdDisponible(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function pedirFaceID(){const id=lsGet('faceId');if(!id)return false;
  try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:ub64(id)}],userVerification:'required',timeout:60000}});return true}catch(e){return false}}
let _bloqueado=false;
function bloquear(){
  if(_bloqueado||!bloqueoActivo())return Promise.resolve();
  _bloqueado=true;
  return new Promise(res=>{
    const ov=document.createElement('div');ov.id='lock';let pin='';
    const pinta=()=>{ov.querySelector('.dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<pin.length?'on':''}"></i>`).join('')};
    const ok=()=>{ov.remove();_bloqueado=false;res()};
    ov.innerHTML=`<div class="lockin"><div style="width:64px;margin:0 auto 12px">${LOGO_SVG}</div><div style="font-weight:700;font-size:18px">Mis Finanzas</div>
      <div class="mini" id="lockMsg" style="margin:4px 0 14px">Ingresa tu PIN</div><div class="dots"></div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9,'fid',0,'del'].map(k=>`<button data-k="${k}">${k==='del'?'⌫':k==='fid'?(lsGet('faceId')?'<span style="font-size:13px">Face ID</span>':''):k}</button>`).join('')}</div></div>`;
    document.body.appendChild(ov);pinta();
    ov.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
      if(k==='del'){pin=pin.slice(0,-1);pinta();return}
      if(k==='fid'){if(lsGet('faceId')&&await pedirFaceID())ok();return}
      if(pin.length<4){pin+=k;pinta()}
      if(pin.length===4){if(await hashPin(pin)===lsGet('pinHash'))ok();else{ov.querySelector('#lockMsg').textContent='PIN incorrecto';pin='';setTimeout(pinta,150);if(navigator.vibrate)navigator.vibrate(120)}}});
    if(lsGet('faceId'))pedirFaceID().then(v=>{if(v)ok()});
  });
}
let _oculta=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)_oculta=Date.now();else if(_oculta&&Date.now()-_oculta>120000&&ES_PWA)bloquear()});

function verSeguridad(){
  const on=bloqueoActivo(),fid=!!lsGet('faceId');
  document.getElementById('sheet').innerHTML=`<h3>🔒 Seguridad</h3>
    <div class="mini" style="margin-bottom:10px">El bloqueo pide tu PIN o Face ID al abrir la app y después de 2 minutos fuera de ella. Funciona solo en este teléfono.</div>
    <div class="cta" style="cursor:default"><span>Bloqueo con PIN</span><b class="${on?'ing':''}">${on?'Activado':'Desactivado'}</b></div>
    ${on?`<div class="cta" style="cursor:default"><span>Face ID</span><b class="${fid?'ing':''}">${fid?'Activado':'Desactivado'}</b></div>`:''}
    ${!on?`<label>Elige un PIN de 4 dígitos</label><input class="in" id="pin1" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><input class="in" id="pin2" style="margin-top:8px" type="password" inputmode="numeric" maxlength="4" placeholder="Repítelo">
      <button class="btn" onclick="activarPin(this)">Activar bloqueo</button>`:
      `${fid?'':`<button class="btn" onclick="activarFaceID(this)">Activar Face ID</button>`}<button class="btn sec" onclick="desactivarBloqueo()">Desactivar bloqueo</button>`}
    ${ES_PWA?`<button class="btn del" onclick="desvincular()">Desvincular este teléfono</button>`:''}
    <button class="btn sec" onclick="cerrar()">Cerrar</button>`;
  document.getElementById('sheetBg').classList.add('show');
}
async function activarPin(b){const a=document.getElementById('pin1').value,c=document.getElementById('pin2').value;
  if(!/^\d{4}$/.test(a)){toast('El PIN debe tener 4 números');return}if(a!==c){toast('Los PIN no coinciden');return}
  lsSet('pinHash',await hashPin(a));toast('Bloqueo activado');if(await faceIdDisponible())verSeguridad();else cerrar()}
async function activarFaceID(b){
  if(!await faceIdDisponible()){toast('Este dispositivo no tiene Face ID disponible para la app');return}
  try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Mis Finanzas'},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'mis-finanzas',displayName:'Mis Finanzas'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
    lsSet('faceId',b64u(c.rawId));toast('Face ID activado');verSeguridad()}catch(e){toast('No se pudo activar Face ID')}}
function desactivarBloqueo(){try{localStorage.removeItem('pinHash');localStorage.removeItem('faceId')}catch(e){}toast('Bloqueo desactivado');verSeguridad()}
function desvincular(){['apiK','apiU','cacheD','pinHash','faceId'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()}

/* --- Desde la versión de Google: instalar la app --- */
async function instalarApp(b){b.disabled=true;
  try{const url=await call('getEnlaceInstalacion');const h=new URLSearchParams(url.split('#')[1]);
    document.getElementById('sheet').innerHTML=`<h3>📱 Instalar Mis Finanzas</h3>
      <div class="mini" style="font-size:14px;line-height:1.5">Hazlo desde el iPhone, en <b>Safari</b>:<br>1. Toca «Abrir la app».<br>2. En la página que se abre toca <b>Compartir ⬆️ → Agregar a pantalla de inicio</b>.<br>3. Abre «Mis Finanzas» desde tu pantalla de inicio y activa el bloqueo en Análisis → 🔒 Seguridad.</div>
      <a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:14px" href="${url}" target="_blank" rel="noopener">Abrir la app</a>
      <button class="btn sec" onclick="navigator.clipboard.writeText('${h.get('k')}').then(()=>toast('Código copiado'))">Copiar código</button>
      <button class="btn sec" onclick="navigator.clipboard.writeText('${h.get('u')}').then(()=>toast('Dirección copiada'))">Copiar dirección del servidor</button>
      <div class="mini" style="margin-top:8px">No compartas este enlace: da acceso a tus finanzas.</div>
      <button class="btn sec" onclick="cerrar()">Cerrar</button>`;
    document.getElementById('sheetBg').classList.add('show')}catch(e){}b.disabled=false}

async function iniciar(){
  if(ES_PWA){
    const h=new URLSearchParams(location.hash.slice(1));
    if(h.get('k')&&h.get('u')){try{localStorage.setItem('apiK',h.get('k'));localStorage.setItem('apiU',h.get('u'))}catch(e){}
      if(esStandalone())history.replaceState(null,'',location.pathname)}
    const c=apiCfg();if(!c.k||!c.u){pantallaVincular();return}
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
    if(!esStandalone()&&/iPhone|iPad/.test(navigator.userAgent))setTimeout(()=>toast('Para instalarla: Compartir ⬆️ → Agregar a pantalla de inicio'),1500);
    await bloquear();
  }
  cargar();
}
aplicarTema();
iniciar();
</script>
